# Blueprint de PRUEBAS para el feature de base de datos (rama
# base-datos-postgres) — proyecto Render aparte ("horariopruebas"), con su
# propia Postgres gestionada por Render. No toca ni reemplaza el Blueprint
# real de producción (ese sigue en la rama `produccion`, sin esta base de
# datos) — es solo para validar multi-campus/Quito/Latacunga en una URL
# pública antes de llevarlo al servidor propio. Ver DEPLOY.md.
databases:
  - name: horarios-pruebas-db
    plan: free
    databaseName: horarios_pruebas
    user: horarios

services:
  # Backend: datos, login de admin, parseo de PDF. DATA_SOURCE=bd porque
  # esto es justo lo que estamos probando (a diferencia del Blueprint de
  # producción, que sigue en modo archivo).
  - type: web
    name: horarios-api-pruebas
    runtime: docker
    repo: https://github.com/CZurita14/HorarioAulas
    branch: base-datos-postgres
    dockerfilePath: ./back/server/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /app/data
      - key: DATA_SOURCE
        value: bd
      - key: DATABASE_URL
        fromDatabase:
          name: horarios-pruebas-db
          property: connectionString

  # Front: la app web, con nginx haciendo de proxy hacia horarios-api-pruebas.
  # API_BASE_URL se completa a mano después del primer deploy (ver DEPLOY.md,
  # sección "Demo rápida en Render"): la resolución DNS interna de Render
  # entre dos Web Services no funcionó de forma confiable, así que el proxy
  # usa la URL pública real del backend en vez de un nombre interno.
  - type: web
    name: horarios-front-pruebas
    runtime: docker
    repo: https://github.com/CZurita14/HorarioAulas
    branch: base-datos-postgres
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: API_BASE_URL
        sync: false
