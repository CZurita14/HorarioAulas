services:
  # Backend: datos, login de admin, parseo de PDF.
  - type: web
    name: horarios-api
    runtime: docker
    repo: https://github.com/CZurita14/HorarioAulas
    branch: produccion
    dockerfilePath: ./back/server/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /app/data

  # Front: la app web, con nginx haciendo de proxy hacia horarios-api.
  # API_BASE_URL se completa a mano después del primer deploy (ver DEPLOY.md,
  # sección "Demo rápida en Render"): la resolución DNS interna de Render
  # entre dos Web Services no funcionó de forma confiable, así que el proxy
  # usa la URL pública real de horarios-api en vez de un nombre interno.
  - type: web
    name: horarios-front
    runtime: docker
    repo: https://github.com/CZurita14/HorarioAulas
    branch: produccion
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: API_BASE_URL
        sync: false
